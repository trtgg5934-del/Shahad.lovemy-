
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إلى شهد ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ffe6eb 0%, #def3f8 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* شاشة القفل */
    .lock-screen {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(230, 80, 115, 0.15);
      text-align: center;
      max-width: 400px;
      width: 100%;
      border: 2px solid #fff;
    }

    .lock-screen h2 {
      color: #c9184a;
      margin-bottom: 15px;
      font-size: 1.5rem;
    }

    .password-input {
      width: 100%;
      padding: 12px 20px;
      font-size: 1.1rem;
      border: 2px solid #ffb3c1;
      border-radius: 50px;
      outline: none;
      text-align: center;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    .password-input:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 10px rgba(255, 77, 109, 0.2);
    }

    .error-msg {
      color: #d90429;
      font-size: 0.9rem;
      margin-bottom: 10px;
      display: none;
    }

    /* المحتوى الرئيسي (مخفي في البداية) */
    .main-content {
      display: none;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(230, 80, 115, 0.15);
      text-align: center;
      max-width: 500px;
      width: 100%;
      border: 2px solid #fff;
      animation: fadeIn 0.8s ease-in-out;
    }

    .heart-icon {
      font-size: 50px;
      color: #ff4d6d;
      animation: pulse 1.5s infinite;
      display: inline-block;
      margin-bottom: 10px;
    }

    h1 {
      color: #c9184a;
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .date-badge {
      display: inline-block;
      background-color: #ffb3c1;
      color: #590d22;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .message-box {
      background-color: #fff0f3;
      border-right: 4px solid #ff4d6d;
      padding: 20px;
      border-radius: 12px;
      text-align: right;
      line-height: 1.8;
      color: #590d22;
      font-size: 1.1rem;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(45deg, #ff4d6d, #ff758f);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3);
      transition: all 0.3s ease;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(255, 77, 109, 0.4);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- شاشة إدخال الرقم السري -->
  <div class="lock-screen" id="lockScreen">
    <div class="heart-icon">🔒</div>
    <h2>أدخلي السر لفتح الصفحة ✨</h2>
    <input type="text" class="password-input" id="passInput" placeholder="اكتبي التاريخ هنا...">
    <div class="error-msg" id="errorMsg">الكلمة غير صحيحة، حاولي مرة أخرى ❤️</div>
    <button class="btn" onclick="checkPassword()">دخول</button>
  </div>

  <!-- المحتوى الرئيسي للمعايدة -->
  <div class="main-content" id="mainContent">
    <div class="heart-icon">❤️</div>
    <h1>إلى شهد 💖</h1>
    
    <div class="date-badge">
      📅 25 أغسطس | 🕒 12:02
    </div>

    <div class="message-box">
      أحس إني صج محظوظ بوجود إنسانة مثلج بحياتي.. <br>
      أحبج وايد وايد، وكل يوم ينعاد عليج وأنتي أغلى وأجمل شيء صار لي ✨
    </div>

    <button class="btn" onclick="celebrate()">اضغطي هنا يا شهد ✨</button>
  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('passInput').value.trim();
      const lockScreen = document.getElementById('lockScreen');
      const mainContent = document.getElementById('mainContent');
      const errorMsg = document.getElementById('errorMsg');

      // قبول الكلمة سواء كُتبت بألف بأليغ/بدون أو بمسافات مختلفة
      if (input === "25 اغسطس" || input === "25 أغسطس" || input === "25اغسطس" || input === "25أغسطس") {
        lockScreen.style.display = "none";
        mainContent.style.display = "block";
        celebrate(); // إطلاق الاحتفال فور الدخول
      } else {
        errorMsg.style.display = "block";
      }
    }

    function celebrate() {
      confetti({
        particleCount: 120,
        spread: 70,
        origin: { y: 0.6 }
      });

      setTimeout(() => {
        confetti({
          particleCount: 50,
          angle: 60,
          spread: 55,
          origin: { x: 0 }
        });
        confetti({
          particleCount: 50,
          angle: 120,
          spread: 55,
          origin: { x: 1 }
        });
      }, 250);
    }
  </script>

</body>
</html>
